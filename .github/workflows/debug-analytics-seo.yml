name: Debug analytics and SEO tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PUPPETEER_NO_SANDBOX: true

jobs:
  diagnostics:
    if: github.event.pull_request.head.ref == 'agent/analytics-seo-deep-research'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/analytics-seo-deep-research
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply queue fix in diagnostic worktree
        run: python tools/finalize-analytics-seo.py
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build
      - name: Run tests and preserve complete output
        id: tests
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: analytics-seo-test-output
          path: test-output.log
          retention-days: 2
      - name: Fail when tests failed
        if: steps.tests.outputs.status != '0'
        run: exit 1
