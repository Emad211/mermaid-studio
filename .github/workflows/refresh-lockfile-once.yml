name: Refresh lockfile once

on:
  push:
    branches:
      - seo/daily-kanban-2026-08-08

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor == 'Emad211'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile from declared security targets
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet package-lock.json package.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git add package-lock.json package.json
          git commit -m "security: regenerate lockfile for patched dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}
