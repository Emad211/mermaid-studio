name: Publish daily SEO content

on:
  pull_request:
    paths:
      - "content/daily/**"
      - "scripts/publish-daily-content.mjs"
      - "scripts/validate-daily-content.mjs"
      - "tests/daily-content-publisher.test.mjs"
      - ".github/workflows/publish-daily-content.yml"
  push:
    branches:
      - main
    paths:
      - "content/daily/**"
      - "scripts/publish-daily-content.mjs"
      - "scripts/validate-daily-content.mjs"
      - "tests/daily-content-publisher.test.mjs"
      - ".github/workflows/publish-daily-content.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-seo-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject high-severity production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Compile content into site registries
        run: node scripts/publish-daily-content.mjs

      - name: Run publisher unit tests
        run: node --test tests/daily-content-publisher.test.mjs

      - name: Validate JavaScript
        run: npm run check

      - name: Render every Mermaid example
        id: render_examples
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-daily-content.mjs 2>&1 | tee daily-content-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-validation
          path: daily-content-validation.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when Mermaid validation fails
        if: steps.render_examples.outcome == 'failure'
        run: exit 1

      - name: Show generated changes
        run: git diff --stat && git diff --check

      - name: Commit generated site files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "nemodara-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/server/article-content.js src/server/learn-content.js src/server/seo.js public/js/templates.js tests/editorial-pages.test.mjs
          git commit -m "publish daily SEO content"
          git push
