name: Publish daily SEO content

on:
  pull_request:
    paths:
      - "content/daily/**"
      - "scripts/publish-daily-content.mjs"
      - "scripts/sync-content-indexes.mjs"
      - "scripts/validate-daily-content.mjs"
      - "public/learn.html"
      - "public/templates.html"
      - "public/js/bidi.js"
      - "public/js/docs.js"
      - "public/js/templates.js"
      - "public/css/templates.css"
      - "tests/daily-content-publisher.test.mjs"
      - "tests/content-index-sync.test.mjs"
      - "tests/editorial-pages.test.mjs"
      - "tests/bidi-content.test.mjs"
      - ".github/workflows/publish-daily-content.yml"
  push:
    branches:
      - main
    paths:
      - "content/daily/**"
      - "scripts/publish-daily-content.mjs"
      - "scripts/sync-content-indexes.mjs"
      - "scripts/validate-daily-content.mjs"
      - "public/learn.html"
      - "public/templates.html"
      - "public/js/bidi.js"
      - "public/js/docs.js"
      - "public/js/templates.js"
      - "public/css/templates.css"
      - "tests/daily-content-publisher.test.mjs"
      - "tests/content-index-sync.test.mjs"
      - "tests/editorial-pages.test.mjs"
      - "tests/bidi-content.test.mjs"
      - ".github/workflows/publish-daily-content.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-seo-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: seo/daily-block-diagram-2026-08-04
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate patched transitive dependency lockfile
        run: npm update ip-address --package-lock-only --ignore-scripts

      - name: Verify patched dependency security
        run: |
          node -e "const lock=require('./package-lock.json'); const v=lock.packages['node_modules/ip-address']?.version; const p=v?.split('.').map(Number); if(!p || p[0] < 10 || (p[0] === 10 && p[1] < 3) || (p[0] === 10 && p[1] === 3 && p[2] < 1)) throw new Error('Expected ip-address >=10.3.1, got '+v);"
          npm audit --omit=dev --audit-level=high

      - name: Commit patched lockfile and restore workflow
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/publish-daily-content.yml
          git config user.name "nemodara-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json .github/workflows/publish-daily-content.yml
          git commit -m "fix vulnerable ip-address transitive dependency"
          git push origin HEAD:seo/daily-block-diagram-2026-08-04

      - name: Compile content into site registries
        run: node scripts/publish-daily-content.mjs

      - name: Synchronize crawlable content indexes
        run: node scripts/sync-content-indexes.mjs

      - name: Run publisher and index unit tests
        run: node --test tests/daily-content-publisher.test.mjs tests/content-index-sync.test.mjs

      - name: Validate JavaScript
        run: npm run check

      - name: Render every Mermaid example
        id: render_examples
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-daily-content.mjs 2>&1 | tee daily-content-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-validation
          path: daily-content-validation.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when Mermaid validation fails
        if: steps.render_examples.outcome == 'failure'
        run: exit 1

      - name: Show generated changes
        run: git diff --stat && git diff --check
