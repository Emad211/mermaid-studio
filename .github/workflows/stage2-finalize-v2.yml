name: Finalize Nemodara stage 2 v2

on:
  push:
    branches: [agent/editor-ads-launch-readiness]
    paths:
      - .stage2fix/**
      - .github/workflows/stage2-finalize-v2.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nemodara-stage-2-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/editor-ads-launch-readiness
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct exact source and apply deterministic correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .stage2b -maxdepth 1 -name 'part-*.b64' -type f | wc -l)" = "8"
          cat .stage2b/part-*.b64 > /tmp/stage2.payload.b64
          echo '20c88f8e938efbbc915543ce8a834bcff47df2eeb182cc9669d76b3be7b4b429  /tmp/stage2.payload.b64' | sha256sum -c -
          base64 --decode /tmp/stage2.payload.b64 > /tmp/stage2.patch.xz
          echo '9d9b99e128b599aaacbaa294c47f1aa13de5dfc2a3376c7908f352ba8ead0328  /tmp/stage2.patch.xz' | sha256sum -c -
          xz --decompress --stdout /tmp/stage2.patch.xz > /tmp/stage2.patch
          echo '998d6ecc7404def719b5e5193f09479582ef2168c1073c79ea3c2d27459eab4b  /tmp/stage2.patch' | sha256sum -c -
          git apply --check /tmp/stage2.patch
          git apply /tmp/stage2.patch
          node .stage2fix/apply.mjs

      - name: Clean install and build
        env:
          PUPPETEER_NO_SANDBOX: true
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build

      - name: Source, security and release gates
        env:
          PUPPETEER_NO_SANDBOX: true
        run: |
          npm run check
          npm run test:security
          npm run test:release

      - name: Complete browser and API suite
        env:
          PUPPETEER_NO_SANDBOX: true
        run: |
          npm run test:product
          node tests/run.mjs
          npm run smoke:production

      - name: Dependency audits
        run: |
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low

      - name: Compose contracts
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's|^DOMAIN=.*|DOMAIN=nemodara.ir|' .env
          sed -i 's|^SITE_URL=.*|SITE_URL=https://nemodara.ir|' .env
          sed -i 's|^TRUST_PROXY=.*|TRUST_PROXY=true|' .env
          sed -i 's|^ANALYTICS_ADMIN_PASSWORD=.*|ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password|' .env
          sed -i 's|^ANALYTICS_HASH_SECRET=.*|ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|' .env
          sed -i 's|^ADS_EDITOR_FRAME_ORIGIN=.*|ADS_EDITOR_FRAME_ORIGIN=https://ads.nemodara.ir|' .env
          sed -i 's|^RENDER_GET_ENABLED=.*|RENDER_GET_ENABLED=false|' .env
          docker compose config --quiet
          cp .env.local.example .env.local
          sed -i 's|^ANALYTICS_ADMIN_PASSWORD=.*|ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password|' .env.local
          sed -i 's|^ANALYTICS_HASH_SECRET=.*|ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|' .env.local
          docker compose --env-file .env.local -f compose.local.yaml config --quiet

      - name: Production Docker contract
        shell: bash
        run: |
          set -euo pipefail
          image=nemodara:stage2-v2
          container=nemodara-stage2-v2
          volume=nemodara-stage2-v2-data
          docker build --pull --tag "$image" .
          docker volume create "$volume" >/dev/null
          docker run -d --name "$container" -p 127.0.0.1:4321:4321 \
            -e NODE_ENV=production -e SITE_URL=https://nemodara.ir -e SITE_NAME=نمودارا -e TRUST_PROXY=true \
            -e ANALYTICS_ENABLED=true -e ANALYTICS_DATA_DIR=/data/analytics -e ANALYTICS_TIME_ZONE=UTC \
            -e ANALYTICS_ADMIN_USER=admin -e ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password \
            -e ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e ADS_ENABLED=true -e ADS_PUBLISHER_VALIDATED=true -e ADS_PROVIDER=yektanet \
            -e ADS_SCRIPT_URL=https://cdn.yektanet.com/rg_woebegone/scripts_v3/test/rg.complete.js \
            -e ADS_SCRIPT_ID=ua-script-stage2-v2 -e ADS_ALLOWED_ORIGINS=https://cdn.yektanet.com,https://*.yektanet.com \
            -e ADS_SLOT_HOME_INLINE=pos-home-stage2-v2 -e ADS_EDITOR_ENABLED=true \
            -e ADS_EDITOR_REQUIRE_CROSS_ORIGIN=true -e ADS_EDITOR_FRAME_ORIGIN=https://ads.nemodara.ir \
            -e ADS_EDITOR_TRAFFIC_PERCENT=100 -e ADS_EDITOR_LOAD_DELAY_MS=0 \
            -e ADS_SLOT_EDITOR_RAIL=pos-editor-rail-stage2-v2 -e ADS_SLOT_EDITOR_DOCK=pos-editor-dock-stage2-v2 \
            -e RENDER_GET_ENABLED=false -e GSC_ENABLED=false -e INDEXNOW_ENABLED=false \
            -v "$volume":/data/analytics "$image"
          cleanup(){ docker logs "$container" || true; docker rm -f "$container" >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 120); do curl -fsS -H 'Host: nemodara.ir' http://127.0.0.1:4321/api/health >/dev/null && break; sleep 1; done
          curl -fsS -H 'Host: nemodara.ir' http://127.0.0.1:4321/api/health | grep -q '"ok":true'
          curl -fsS -D /tmp/editor.headers -H 'Host: nemodara.ir' http://127.0.0.1:4321/editor -o /tmp/editor.html
          grep -qi 'no-store' /tmp/editor.headers
          ! grep -q 'cdn.yektanet.com/rg_woebegone' /tmp/editor.html
          curl -fsS -H 'Host: nemodara.ir' http://127.0.0.1:4321/api/ads -o /tmp/ads.json
          token=$(node -e 'const x=require("/tmp/ads.json");const t=x.editor?.frameTokens?.editorRail;if(!t)process.exit(1);process.stdout.write(t)')
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: ads.nemodara.ir' -H 'Sec-Fetch-Dest: document' -H 'Sec-Fetch-Site: none' "http://127.0.0.1:4321/ads/editor-frame?slot=editorRail&token=$token")" = 403
          curl -fsS -H 'Host: ads.nemodara.ir' -H 'Sec-Fetch-Dest: iframe' -H 'Sec-Fetch-Site: same-site' -H 'Referer: https://nemodara.ir/editor' "http://127.0.0.1:4321/ads/editor-frame?slot=editorRail&token=$token" | grep -q 'pos-editor-rail-stage2-v2'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: nemodara.ir' 'http://127.0.0.1:4321/api/render?code=flowchart%20TD%3B%20A--%3EB&format=svg')" = 405
          render(){ curl -fsS -X POST http://127.0.0.1:4321/api/render -H 'Host: nemodara.ir' -H 'content-type: application/json' --data "{\"code\":\"flowchart TD; A-->B\",\"format\":\"$1\"}" -o "$2"; }
          render svg /tmp/a.svg; render png /tmp/a.png; render webp /tmp/a.webp; render pdf /tmp/a.pdf
          grep -q '<svg' /tmp/a.svg
          node -e "const f=require('fs');if(f.readFileSync('/tmp/a.png').subarray(0,8).toString('hex')!=='89504e470d0a1a0a')process.exit(1)"
          node -e "const f=require('fs');if(f.readFileSync('/tmp/a.webp').subarray(0,4).toString('ascii')!=='RIFF')process.exit(1)"
          grep -q '%PDF-' /tmp/a.pdf
          curl -fsS -u admin:ci-only-long-random-password -H 'Host: nemodara.ir' http://127.0.0.1:4321/api/admin/launch/readiness | grep -q analytics-storage

      - name: Commit validated source and remove all temporary transfer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .stage2 .stage2b .stage2fix
          rm -f .github/workflows/stage2-finalize.yml .github/workflows/stage2-finalize-v2.yml \
            .github/workflows/stage2-diagnose.yml .github/workflows/stage2-security-diagnose.yml \
            .github/workflows/stage2-cookie-diagnose.yml .env .env.local
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only | grep -E '^\.stage2|stage2-(finalize|diagnose|security|cookie)' || true)"
          git commit -m 'Harden editor ads, revenue accounting and production boundaries'
          git push origin HEAD:agent/editor-ads-launch-readiness
