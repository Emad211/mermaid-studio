name: Commit validated Nemodara stage 2 source

on:
  push:
    branches: [agent/editor-ads-launch-readiness]
    paths:
      - .github/workflows/stage2-commit-source.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nemodara-stage-2-finalize
  cancel-in-progress: true

jobs:
  commit:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/editor-ads-launch-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/editor-ads-launch-readiness
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Reconstruct the source that passed browser and Docker validation
        shell: bash
        run: |
          set -euo pipefail
          cat .stage2b/part-*.b64 > /tmp/stage2.payload.b64
          echo '20c88f8e938efbbc915543ce8a834bcff47df2eeb182cc9669d76b3be7b4b429  /tmp/stage2.payload.b64' | sha256sum -c -
          base64 --decode /tmp/stage2.payload.b64 | xz --decompress --stdout > /tmp/stage2.patch
          echo '998d6ecc7404def719b5e5193f09479582ef2168c1073c79ea3c2d27459eab4b  /tmp/stage2.patch' | sha256sum -c -
          git apply --check /tmp/stage2.patch
          git apply /tmp/stage2.patch
          node .stage2fix/apply.mjs
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build
          npm run check
          npm run test:security
          npm run test:release
      - name: Prepare a source-only commit
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's Actions token must not create/update/delete workflow files.
          git checkout HEAD -- .github/workflows/ci.yml
          rm -rf .stage2 .stage2b .stage2fix
          rm -f .env .env.local
          test ! -e .stage2
          test ! -e .stage2b
          test ! -e .stage2fix
      - name: Commit the validated non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git commit -m 'Harden editor ads, revenue accounting and production boundaries'
          git push origin HEAD:agent/editor-ads-launch-readiness
