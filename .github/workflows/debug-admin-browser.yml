name: Debug admin browser

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    if: github.event.pull_request.head.ref == 'agent/admin-growth-control-center'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/admin-growth-control-center
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run admin browser test and preserve output
        id: browser
        shell: bash
        env:
          PUPPETEER_NO_SANDBOX: true
        run: |
          set +e
          node --test tests/admin-browser.test.mjs > admin-browser.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: admin-browser-diagnostics
          path: admin-browser.log
          retention-days: 2
      - name: Fail when browser test failed
        if: steps.browser.outputs.status != '0'
        run: exit 1
