name: Diagnose Nemodara stage 2 suite

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nemodara-stage-2-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/editor-ads-launch-readiness

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct the exact audited source
        shell: bash
        run: |
          set -euo pipefail
          cat .stage2b/part-*.b64 > /tmp/stage2.payload.b64
          echo '20c88f8e938efbbc915543ce8a834bcff47df2eeb182cc9669d76b3be7b4b429  /tmp/stage2.payload.b64' | sha256sum -c -
          base64 --decode /tmp/stage2.payload.b64 | xz --decompress --stdout > /tmp/stage2.patch
          echo '998d6ecc7404def719b5e5193f09479582ef2168c1073c79ea3c2d27459eab4b  /tmp/stage2.patch' | sha256sum -c -
          git apply --check /tmp/stage2.patch
          git apply /tmp/stage2.patch
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build

      - name: Syntax contract
        run: npm run check

      - name: Security contracts
        env:
          PUPPETEER_NO_SANDBOX: true
        run: npm run test:security

      - name: Release contracts
        env:
          PUPPETEER_NO_SANDBOX: true
        run: npm run test:release

      - name: Core and admin browser flows
        env:
          PUPPETEER_NO_SANDBOX: true
        run: node --test tests/browser.test.mjs tests/admin-browser.test.mjs

      - name: Editorial and professional editor flows
        env:
          PUPPETEER_NO_SANDBOX: true
        run: node --test tests/editorial-pages.test.mjs tests/editor-professional.test.mjs tests/product-growth-v3.test.mjs

      - name: Isolated editor advertising flows
        env:
          PUPPETEER_NO_SANDBOX: true
        run: node --test tests/editor-ads-launch.test.mjs tests/editor-ads-browser.test.mjs

      - name: Data, localization, SEO and admin API flows
        env:
          PUPPETEER_NO_SANDBOX: true
        run: node --test tests/localization.test.mjs tests/ads.test.mjs tests/analytics.test.mjs tests/seo.test.mjs tests/admin-control-center.test.mjs

      - name: End-to-end product API
        env:
          PUPPETEER_NO_SANDBOX: true
        run: node tests/product.mjs

      - name: Renderer integration suite
        env:
          PUPPETEER_NO_SANDBOX: true
        run: node tests/run.mjs

      - name: Production smoke and dependency audit
        env:
          PUPPETEER_NO_SANDBOX: true
        run: |
          npm run smoke:production
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
