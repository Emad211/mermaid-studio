name: Build product audit source bundle

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/editor-ads-launch-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/editor-ads-launch-readiness
      - name: Prepare source bundle
        run: tar --exclude=.git --exclude=node_modules --exclude=.env --exclude=.env.local -czf /tmp/nemodara-source-audit.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: nemodara-source-audit
          path: /tmp/nemodara-source-audit.tar.gz
          retention-days: 2
