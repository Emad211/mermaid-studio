name: Finalize analytics and SEO branch

on:
  push:
    branches:
      - agent/analytics-seo-deep-research
    paths:
      - tools/finalize-analytics-seo.py
      - .github/workflows/finalize-analytics-seo.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  PUPPETEER_NO_SANDBOX: true

concurrency:
  group: finalize-analytics-seo
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/analytics-seo-deep-research'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/analytics-seo-deep-research
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic source fixes
        run: python tools/finalize-analytics-seo.py

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install, build and test
        run: |
          npm ci
          npm run build
          npm test
          npm run smoke:production

      - name: Validate production Compose
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's|^DOMAIN=.*|DOMAIN=diagram.example.com|' .env
          sed -i 's|^SITE_URL=.*|SITE_URL=https://diagram.example.com|' .env
          sed -i 's|^ANALYTICS_ADMIN_PASSWORD=.*|ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password|' .env
          sed -i 's|^ANALYTICS_HASH_SECRET=.*|ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|' .env
          docker compose config --quiet

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/finalize-analytics-seo.py .github/workflows/finalize-analytics-seo.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize first-party analytics and deep SEO"
          git push origin HEAD:agent/analytics-seo-deep-research
