name: Finalize Nemodara editorial redesign

on:
  push:
    branches:
      - agent/nemodara-editorial-redesign
    paths:
      - tools/finalize-nemodara-redesign.py
      - .github/workflows/finalize-nemodara-redesign.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-nemodara-editorial-redesign
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/nemodara-editorial-redesign'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/nemodara-editorial-redesign
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply server-rendered article and SEO integration
        run: python tools/finalize-nemodara-redesign.py

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Build and run all source tests
        env:
          PUPPETEER_NO_SANDBOX: true
        run: |
          npm ci
          npm run build
          npm test
          npm run smoke:production
          npm audit --omit=dev --audit-level=high

      - name: Validate production and local Compose
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's|^ANALYTICS_ADMIN_PASSWORD=.*|ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password|' .env
          sed -i 's|^ANALYTICS_HASH_SECRET=.*|ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|' .env
          docker compose config --quiet
          cp .env.local.example .env.local
          sed -i 's|^ANALYTICS_ADMIN_PASSWORD=.*|ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password|' .env.local
          sed -i 's|^ANALYTICS_HASH_SECRET=.*|ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|' .env.local
          docker compose --env-file .env.local -f compose.local.yaml config --quiet

      - name: Build and smoke-test production image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --tag nemodara:editorial-ci .
          docker volume create nemodara-editorial-ci >/dev/null
          docker run -d --name nemodara-editorial-ci \
            -p 127.0.0.1:4321:4321 \
            -e SITE_URL=https://nemodara.ir \
            -e SITE_NAME=نمودارا \
            -e SEO_LAST_MODIFIED=2026-07-15 \
            -e SEO_AUTHOR_NAME='تیم تحریریه نمودارا' \
            -e ANALYTICS_ENABLED=true \
            -e ANALYTICS_DATA_DIR=/data/analytics \
            -e ANALYTICS_ADMIN_USER=admin \
            -e ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password \
            -e ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e ADS_ENABLED=false \
            -v nemodara-editorial-ci:/data/analytics \
            nemodara:editorial-ci
          trap 'docker logs nemodara-editorial-ci || true; docker rm -f nemodara-editorial-ci >/dev/null 2>&1 || true; docker volume rm nemodara-editorial-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:4321/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4321/ | grep -q 'نمودار خوب'
          curl -fsS http://127.0.0.1:4321/learn | grep -q 'Mermaid را برای حل مسئله'
          curl -fsS http://127.0.0.1:4321/learn/flowchart-mermaid | grep -q 'article-summary'
          curl -fsS http://127.0.0.1:4321/learn/flowchart-mermaid | grep -q 'data-article-toc'
          curl -fsS http://127.0.0.1:4321/sitemap.xml | grep -q 'https://nemodara.ir/learn/flowchart-mermaid'
          curl -fsS -X POST http://127.0.0.1:4321/api/render \
            -H 'content-type: application/json' \
            --data '{"code":"flowchart TD; A-->B","format":"pdf"}' \
            --output /tmp/nemodara.pdf
          grep -q '%PDF-' /tmp/nemodara.pdf

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/finalize-nemodara-redesign.py .github/workflows/finalize-nemodara-redesign.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Nemodara editorial landing and learning redesign"
          git push origin HEAD:agent/nemodara-editorial-redesign
