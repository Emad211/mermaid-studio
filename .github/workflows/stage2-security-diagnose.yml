name: Diagnose Nemodara stage 2 security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nemodara-stage-2-security-diagnose
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/editor-ads-launch-readiness
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Reconstruct audited source
        shell: bash
        run: |
          set -euo pipefail
          cat .stage2b/part-*.b64 | base64 --decode | xz --decompress --stdout > /tmp/stage2.patch
          echo '998d6ecc7404def719b5e5193f09479582ef2168c1073c79ea3c2d27459eab4b  /tmp/stage2.patch' | sha256sum -c -
          git apply --check /tmp/stage2.patch
          git apply /tmp/stage2.patch
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build
      - name: Secure rollout cookie
        run: node --test --test-name-pattern='production rollout cookie' tests/security.test.mjs
      - name: Signed token binding and expiry
        run: node --test --test-name-pattern='editor frame tokens' tests/security.test.mjs
      - name: Isolated frame navigation boundary
        run: node --test --test-name-pattern='isolated ad frame' tests/security.test.mjs
      - name: Public and operational health boundary
        run: node --test --test-name-pattern='public health' tests/security.test.mjs
      - name: GET renderer privacy boundary
        run: node --test --test-name-pattern='production GET rendering' tests/security.test.mjs
      - name: Admin and analytics same-origin boundary
        run: node --test --test-name-pattern='admin mutations' tests/security.test.mjs
      - name: Public cache and publisher isolation boundary
        run: node --test --test-name-pattern='public content is CDN-cacheable' tests/security.test.mjs
