name: Finalize idempotent Search Console imports

on:
  push:
    branches:
      - agent/analytics-seo-deep-research
    paths:
      - tools/fix-search-import.py
      - .github/workflows/fix-search-import.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  PUPPETEER_NO_SANDBOX: true

concurrency:
  group: fix-search-import
  cancel-in-progress: false

jobs:
  fix-and-validate:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/analytics-seo-deep-research'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/analytics-seo-deep-research
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: python tools/fix-search-import.py
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run smoke:production
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/fix-search-import.py .github/workflows/fix-search-import.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Search Console imports idempotent"
          git push origin HEAD:agent/analytics-seo-deep-research
