name: Finalize local Docker experience

on:
  push:
    branches:
      - agent/local-docker-experience
    paths:
      - tools/finalize-local-docker.py
      - .github/workflows/finalize-local-docker.yml

permissions:
  contents: write

concurrency:
  group: finalize-local-docker-experience
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/local-docker-experience
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Synchronize generated metadata and executable mode
        shell: bash
        run: |
          set -euo pipefail
          python tools/finalize-local-docker.py
          chmod +x scripts/docker-local.sh

      - name: Install, build and run the complete source test suite
        env:
          PUPPETEER_NO_SANDBOX: true
        run: |
          npm ci
          npm run build
          npm test
          npm run smoke:production
          npm audit --omit=dev --audit-level=high

      - name: Validate local scripts and Compose
        shell: bash
        run: |
          set -euo pipefail
          cp .env.local.example .env.local
          sed -i 's|^ANALYTICS_ADMIN_PASSWORD=.*|ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password|' .env.local
          sed -i 's|^ANALYTICS_HASH_SECRET=.*|ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|' .env.local
          bash -n scripts/docker-local.sh
          ./scripts/docker-local.sh doctor
          docker compose --env-file .env.local -f compose.local.yaml config --quiet
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/docker-local.ps1"), [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'

      - name: Build image and run the full local Docker test
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --tag mermaid-studio:local-ci .
          sed -i 's|^LOCAL_IMAGE=.*|LOCAL_IMAGE=mermaid-studio:local-ci|' .env.local
          cleanup() {
            docker compose --env-file .env.local -f compose.local.yaml logs --tail 200 app || true
            docker compose --env-file .env.local -f compose.local.yaml down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose --env-file .env.local -f compose.local.yaml up -d --no-build --remove-orphans
          for attempt in $(seq 1 120); do
            container=$(docker compose --env-file .env.local -f compose.local.yaml ps -q app)
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ] || [ "$status" = exited ]; then exit 1; fi
            sleep 1
          done
          docker compose --env-file .env.local -f compose.local.yaml exec -T app \
            node scripts/docker-local-smoke.mjs --full

      - name: Commit validated local Docker source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/finalize-local-docker.py .github/workflows/finalize-local-docker.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize one-command local Docker environment"
          git push origin HEAD:agent/local-docker-experience
