name: Debug editor ads Docker smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-diagnostics:
    if: github.event.pull_request.head.ref == 'agent/editor-ads-launch-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/editor-ads-launch-readiness
      - name: Prepare generated source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/finalize-editor-ads-launch.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '"""          adSlotViews: 0,\n          revenueRial: 0,\n"""',
              '"""        adSlotViews: 0,\n        revenueRial: 0,\n"""',
          ).replace(
              '"""          adSlotViews: 0,\n          adViewable: 0,\n          revenueRial: 0,\n"""',
              '"""        adSlotViews: 0,\n        adViewable: 0,\n        revenueRial: 0,\n"""',
          ).replace(
              'ADS_EDITOR_REQUIRE_CROSS_ORIGIN=true\nADS_EDITOR_FRAME_ORIGIN=https://ads.nemodara.ir\n',
              'ADS_EDITOR_REQUIRE_CROSS_ORIGIN=true\nADS_EDITOR_FRAME_ORIGIN=https://ads.nemodara.ir\nADS_EDITOR_TRAFFIC_PERCENT=25\nADS_EDITOR_LOAD_DELAY_MS=1800\n',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python tools/finalize-editor-ads-launch.py
          python tools/harden-editor-ad-host.py
          python tools/apply-server-editor-rollout.py
          python tools/finalize-editor-rollout-metadata.py
          npm install --package-lock-only --ignore-scripts

      - name: Run Docker diagnostics without truncation
        id: diagnose
        shell: bash
        run: |
          set +e
          mkdir -p docker-diag
          log=docker-diag/smoke.log
          : > "$log"
          overall=0
          check() {
            name="$1"; shift
            echo "===== $name =====" | tee -a "$log"
            "$@" >> "$log" 2>&1
            code=$?
            echo "STATUS=$code" | tee -a "$log"
            if [ "$code" -ne 0 ]; then overall=$code; fi
          }

          check build docker build --pull --tag nemodara:editor-ads-debug .
          if [ "$overall" -eq 0 ]; then
            docker volume create nemodara-editor-ads-debug >> "$log" 2>&1
            docker run -d --name nemodara-editor-ads-debug \
              -p 127.0.0.1:4321:4321 \
              -e SITE_URL=https://nemodara.ir \
              -e SITE_NAME=نمودارا \
              -e TRUST_PROXY=true \
              -e ANALYTICS_ENABLED=true \
              -e ANALYTICS_DATA_DIR=/data/analytics \
              -e ANALYTICS_TIME_ZONE=UTC \
              -e ANALYTICS_ADMIN_USER=admin \
              -e ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password \
              -e ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
              -e ADS_ENABLED=true \
              -e ADS_PROVIDER=yektanet \
              -e ADS_SCRIPT_URL=https://cdn.yektanet.com/rg_woebegone/scripts_v3/test/rg.complete.js \
              -e ADS_SCRIPT_ID=ua-script-test \
              -e ADS_ALLOWED_ORIGINS=https://cdn.yektanet.com,https://*.yektanet.com \
              -e ADS_SLOT_HOME_TOP=pos-home-test \
              -e ADS_EDITOR_ENABLED=true \
              -e ADS_EDITOR_REQUIRE_CROSS_ORIGIN=true \
              -e ADS_EDITOR_FRAME_ORIGIN=https://ads.nemodara.ir \
              -e ADS_EDITOR_TRAFFIC_PERCENT=100 \
              -e ADS_EDITOR_LOAD_DELAY_MS=0 \
              -e ADS_SLOT_EDITOR_RAIL=pos-editor-rail-test \
              -e ADS_SLOT_EDITOR_DOCK=pos-editor-dock-test \
              -e GSC_ENABLED=false \
              -e INDEXNOW_ENABLED=false \
              -v nemodara-editor-ads-debug:/data/analytics \
              nemodara:editor-ads-debug >> "$log" 2>&1
            run_code=$?
            echo "RUN_STATUS=$run_code" | tee -a "$log"
            if [ "$run_code" -ne 0 ]; then overall=$run_code; fi
          fi

          if docker ps --format '{{.Names}}' | grep -qx nemodara-editor-ads-debug; then
            healthy=1
            for attempt in $(seq 1 100); do
              curl -fsS http://127.0.0.1:4321/api/health > docker-diag/health.json 2>> "$log"
              if [ "$?" -eq 0 ]; then healthy=0; break; fi
              sleep 1
            done
            echo "HEALTH_STATUS=$healthy" | tee -a "$log"
            if [ "$healthy" -ne 0 ]; then overall=1; fi

            curl -sS -D docker-diag/editor.headers -c docker-diag/editor.cookies -H 'Host: nemodara.ir' http://127.0.0.1:4321/editor > docker-diag/editor.html 2>> "$log"
            echo "EDITOR_CURL=$?" | tee -a "$log"
            grep -n 'data-ad-slot="editorRail"' docker-diag/editor.html >> "$log" 2>&1; echo "EDITOR_SLOT=$?" | tee -a "$log"
            grep -n 'data-ad-state="reserved"' docker-diag/editor.html >> "$log" 2>&1; echo "EDITOR_RESERVED=$?" | tee -a "$log"
            grep -n 'Set-Cookie:.*nemodara_editor_ads_bucket' docker-diag/editor.headers >> "$log" 2>&1; echo "EDITOR_SET_COOKIE=$?" | tee -a "$log"
            grep -n 'nemodara_editor_ads_bucket' docker-diag/editor.cookies >> "$log" 2>&1; echo "EDITOR_COOKIE_JAR=$?" | tee -a "$log"
            if grep -q 'cdn.yektanet.com/rg_woebegone' docker-diag/editor.html; then echo 'PUBLISHER_SCRIPT_LEAK=1' | tee -a "$log"; overall=1; else echo 'PUBLISHER_SCRIPT_LEAK=0' | tee -a "$log"; fi

            curl -sS -D docker-diag/frame.headers -H 'Host: ads.nemodara.ir' 'http://127.0.0.1:4321/ads/editor-frame?slot=editorRail' > docker-diag/frame.html 2>> "$log"
            echo "FRAME_CURL=$?" | tee -a "$log"
            grep -n 'pos-editor-rail-test' docker-diag/frame.html >> "$log" 2>&1; echo "FRAME_PLACEMENT=$?" | tee -a "$log"
            grep -in 'frame-ancestors.*https://nemodara.ir' docker-diag/frame.headers >> "$log" 2>&1; echo "FRAME_ANCESTORS=$?" | tee -a "$log"

            curl -sS -D docker-diag/redirect.headers -o /dev/null -H 'Host: ads.nemodara.ir' http://127.0.0.1:4321/articles 2>> "$log"
            grep -n '^HTTP/.* 302' docker-diag/redirect.headers >> "$log" 2>&1; echo "AD_HOST_REDIRECT_STATUS=$?" | tee -a "$log"
            grep -in '^location: https://nemodara.ir/articles' docker-diag/redirect.headers >> "$log" 2>&1; echo "AD_HOST_REDIRECT_LOCATION=$?" | tee -a "$log"

            curl -sS -D docker-diag/readiness.headers -u 'admin:ci-only-long-random-password' -H 'Host: nemodara.ir' http://127.0.0.1:4321/api/admin/launch/readiness > docker-diag/readiness.json 2>> "$log"
            echo "READINESS_CURL=$?" | tee -a "$log"
            grep -n '"monetizationReady":true' docker-diag/readiness.json >> "$log" 2>&1; echo "READINESS_MONETIZATION=$?" | tee -a "$log"

            curl -sS -X POST http://127.0.0.1:4321/api/render \
              -H 'content-type: application/json' \
              --data '{"code":"flowchart TD; A-->B","format":"pdf"}' \
              --output docker-diag/output.pdf 2>> "$log"
            echo "PDF_CURL=$?" | tee -a "$log"
            grep -q '%PDF-' docker-diag/output.pdf; echo "PDF_HEADER=$?" | tee -a "$log"
            docker logs nemodara-editor-ads-debug > docker-diag/container.log 2>&1
          fi

          docker rm -f nemodara-editor-ads-debug >> "$log" 2>&1 || true
          docker volume rm nemodara-editor-ads-debug >> "$log" 2>&1 || true
          echo "OVERALL=$overall" | tee -a "$log"
          echo "status=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: editor-ads-docker-diagnostics
          path: docker-diag
          include-hidden-files: true
          retention-days: 2

      - name: Fail when Docker diagnostics failed
        if: steps.diagnose.outputs.status != '0'
        run: exit 1
