name: Finalize admin growth control center

on:
  push:
    branches:
      - agent/admin-growth-control-center
    paths:
      - tools/finalize-admin-growth.py
      - .github/workflows/finalize-admin-growth.yml

permissions:
  contents: write

concurrency:
  group: finalize-admin-growth-control-center
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/admin-growth-control-center
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic backend integration
        run: python tools/finalize-admin-growth.py

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install, build and test
        env:
          PUPPETEER_NO_SANDBOX: true
        run: |
          npm ci
          npm run build
          npm test
          npm run smoke:production
          npm audit --omit=dev --audit-level=high

      - name: Validate production Compose
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's|^DOMAIN=.*|DOMAIN=diagram.example.com|' .env
          sed -i 's|^SITE_URL=.*|SITE_URL=https://diagram.example.com|' .env
          sed -i 's|^ANALYTICS_ADMIN_PASSWORD=.*|ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password|' .env
          sed -i 's|^ANALYTICS_HASH_SECRET=.*|ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|' .env
          docker compose config --quiet

      - name: Build and smoke-test production image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --tag mermaid-studio:admin-ci .
          docker volume create mermaid-studio-admin-ci >/dev/null
          docker run -d --name mermaid-studio-admin-ci \
            -p 127.0.0.1:4321:4321 \
            -e SITE_URL=https://diagram.example.com \
            -e ANALYTICS_ENABLED=true \
            -e ANALYTICS_DATA_DIR=/data/analytics \
            -e ANALYTICS_TIME_ZONE=UTC \
            -e ANALYTICS_ADMIN_USER=admin \
            -e ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password \
            -e ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e ADS_ENABLED=false \
            -e GSC_ENABLED=false \
            -e INDEXNOW_ENABLED=false \
            -v mermaid-studio-admin-ci:/data/analytics \
            mermaid-studio:admin-ci
          trap 'docker logs mermaid-studio-admin-ci || true; docker rm -f mermaid-studio-admin-ci >/dev/null 2>&1 || true; docker volume rm mermaid-studio-admin-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:4321/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4321/api/health
          curl -fsS -u 'admin:ci-only-long-random-password' http://127.0.0.1:4321/admin/analytics | grep -q 'مرکز کنترل درآمد'
          curl -fsS -X PUT -u 'admin:ci-only-long-random-password' \
            -H 'content-type: application/json' \
            --data '{"monthlyPageviews":10000,"monthlyRevenueRial":5000000}' \
            http://127.0.0.1:4321/api/admin/goals | grep -q 'monthlyPageviews'
          curl -fsS -X POST http://127.0.0.1:4321/api/analytics/event \
            -H 'content-type: application/json' \
            --data '{"event":"page_view","session":"container-ci","path":"/"}' \
            -o /dev/null
          curl -fsS -u 'admin:ci-only-long-random-password' 'http://127.0.0.1:4321/api/admin/growth/overview?days=1' | grep -q 'comparison'
          curl -fsS -X POST -u 'admin:ci-only-long-random-password' \
            -H 'content-type: application/json' --data '{}' \
            http://127.0.0.1:4321/api/admin/seo/audit/run | grep -q 'globalChecks'
          curl -fsS -X POST http://127.0.0.1:4321/api/render \
            -H 'content-type: application/json' \
            --data '{"code":"flowchart TD; A-->B","format":"pdf"}' \
            --output /tmp/admin-control-center.pdf
          grep -q '%PDF-' /tmp/admin-control-center.pdf

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/finalize-admin-growth.py .github/workflows/finalize-admin-growth.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize admin growth, revenue and SEO control center"
          git push origin HEAD:agent/admin-growth-control-center
