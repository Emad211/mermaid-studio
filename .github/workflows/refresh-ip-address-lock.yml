name: Refresh ip-address lock

on:
  push:
    branches:
      - seo/daily-block-diagram-2026-08-04
    paths:
      - .github/workflows/refresh-ip-address-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: seo/daily-block-diagram-2026-08-04
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh transitive ip-address resolution
        run: npm update ip-address --package-lock-only --ignore-scripts

      - name: Verify patched resolution and audit
        run: |
          node -e "const lock=require('./package-lock.json'); const v=lock.packages['node_modules/ip-address']?.version; if(v!=='10.3.1') throw new Error('Expected ip-address 10.3.1, got '+v);"
          npm audit --omit=dev --audit-level=high

      - name: Commit lockfile and remove temporary workflow
        run: |
          rm .github/workflows/refresh-ip-address-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-ip-address-lock.yml
          git commit -m "fix vulnerable ip-address transitive dependency"
          git push origin HEAD:seo/daily-block-diagram-2026-08-04
