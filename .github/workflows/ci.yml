name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_NO_SANDBOX: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compile structured editorial content
        run: node scripts/publish-daily-content.mjs
      - name: Synchronize crawlable content indexes
        run: node scripts/sync-content-indexes.mjs
      - name: Commit generated editorial registries on main
        if: github.ref == 'refs/heads/main' && github.actor == 'Emad211'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Generated editorial registries are already current"
            exit 0
          fi
          git add src/server/article-content.js src/server/learn-content.js public/js/templates.js src/server/seo.js tests/editorial-pages.test.mjs
          git commit -m "chore: publish merged daily editorial content"
          git push origin HEAD:main
      - name: Run test suite
        id: test_suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log
      - name: Upload npm test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-test-log
          path: npm-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail when test suite fails
        if: steps.test_suite.outcome == 'failure'
        run: exit 1
      - run: npm run smoke:production
      - name: Reject high-severity production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Validate production Docker Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's|^DOMAIN=.*|DOMAIN=diagram.example.com|' .env
          sed -i 's|^SITE_URL=.*|SITE_URL=https://diagram.example.com|' .env
          sed -i 's|^ANALYTICS_ADMIN_PASSWORD=.*|ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password|' .env
          sed -i 's|^ANALYTICS_HASH_SECRET=.*|ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|' .env
          docker compose config --quiet
      - name: Validate local Docker scripts and Compose configuration
        shell: bash
        run: |
          cp .env.local.example .env.local
          sed -i 's|^ANALYTICS_ADMIN_PASSWORD=.*|ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password|' .env.local
          sed -i 's|^ANALYTICS_HASH_SECRET=.*|ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|' .env.local
          bash -n scripts/docker-local.sh
          bash scripts/docker-local.sh doctor
          docker compose --env-file .env.local -f compose.local.yaml config --quiet
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/docker-local.ps1"), [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          pwsh -NoProfile -File scripts/docker-local.ps1 doctor

  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compile structured editorial content
        run: node scripts/publish-daily-content.mjs
      - name: Synchronize crawlable content indexes
        run: node scripts/sync-content-indexes.mjs
      - name: Build production image
        run: docker build --pull --tag mermaid-studio:ci .
      - name: Smoke-test production container with persistent analytics volume
        shell: bash
        run: |
          set -euo pipefail
          docker volume create mermaid-studio-ci-analytics >/dev/null
          docker run -d --name mermaid-studio-ci \
            -p 127.0.0.1:4321:4321 \
            -e SITE_URL=https://diagram.example.com \
            -e ANALYTICS_ENABLED=true \
            -e ANALYTICS_DATA_DIR=/data/analytics \
            -e ANALYTICS_ADMIN_USER=admin \
            -e ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password \
            -e ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -v mermaid-studio-ci-analytics:/data/analytics \
            mermaid-studio:ci
          trap 'docker logs mermaid-studio-ci || true; docker rm -f mermaid-studio-ci >/dev/null 2>&1 || true; docker volume rm mermaid-studio-ci-analytics >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4321/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4321/api/health
          curl -fsS http://127.0.0.1:4321/ >/dev/null
          curl -fsS http://127.0.0.1:4321/editor >/dev/null
          curl -fsS http://127.0.0.1:4321/templates >/dev/null
          curl -fsS http://127.0.0.1:4321/learn >/dev/null
          curl -fsS http://127.0.0.1:4321/learn/sequence-diagram-mermaid >/dev/null
          curl -fsS http://127.0.0.1:4321/learn/kanban-mermaid >/dev/null
          curl -fsS http://127.0.0.1:4321/articles/kanban-vs-gantt-for-team-work >/dev/null
          curl -fsS http://127.0.0.1:4321/sitemap.xml | grep -q '/learn/kanban-mermaid'
          curl -fsS -X POST http://127.0.0.1:4321/api/analytics/event \
            -H 'content-type: application/json' \
            --data '{"event":"page_view","path":"/","session":"ci-session"}' \
            -o /dev/null
          curl -fsS -u 'admin:ci-only-long-random-password' 'http://127.0.0.1:4321/api/admin/analytics/summary?days=1' | grep -q 'pageviews'
          curl -fsS -X POST http://127.0.0.1:4321/api/render \
            -H 'content-type: application/json' \
            --data '{"code":"flowchart TD; A-->B","format":"svg"}' \
            --output /tmp/diagram.svg
          grep -q '<svg' /tmp/diagram.svg
          curl -fsS -X POST http://127.0.0.1:4321/api/render \
            -H 'content-type: application/json' \
            --data '{"code":"flowchart TD; A-->B","format":"pdf"}' \
            --output /tmp/diagram.pdf
          grep -q '%PDF-' /tmp/diagram.pdf
      - name: Run the complete local Docker stack and in-container test suite
        shell: bash
        run: |
          set -euo pipefail
          cp .env.local.example .env.local
          sed -i 's|^LOCAL_IMAGE=.*|LOCAL_IMAGE=mermaid-studio:ci|' .env.local
          sed -i 's|^ANALYTICS_ADMIN_PASSWORD=.*|ANALYTICS_ADMIN_PASSWORD=ci-only-long-random-password|' .env.local
          sed -i 's|^ANALYTICS_HASH_SECRET=.*|ANALYTICS_HASH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|' .env.local
          cleanup() {
            docker compose --env-file .env.local -f compose.local.yaml logs --tail 200 app || true
            docker compose --env-file .env.local -f compose.local.yaml down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose --env-file .env.local -f compose.local.yaml up -d --no-build --remove-orphans
          for attempt in $(seq 1 100); do
            container=$(docker compose --env-file .env.local -f compose.local.yaml ps -q app)
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ] || [ "$status" = exited ]; then exit 1; fi
            sleep 1
          done
          docker compose --env-file .env.local -f compose.local.yaml exec -T app \
            node scripts/docker-local-smoke.mjs --full
