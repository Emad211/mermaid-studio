name: mermaid-studio

services:
  app:
    build:
      context: .
    image: mermaid-studio:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      NO_OPEN: 1
      PUPPETEER_NO_SANDBOX: "true"
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env, for example https://diagram.example.com}
      ANALYTICS_DATA_DIR: /data/analytics
      ANALYTICS_ADMIN_PASSWORD: ${ANALYTICS_ADMIN_PASSWORD:?Generate ANALYTICS_ADMIN_PASSWORD in .env}
      ANALYTICS_HASH_SECRET: ${ANALYTICS_HASH_SECRET:?Generate ANALYTICS_HASH_SECRET in .env}
    expose:
      - "4321"
    networks:
      - backend
    volumes:
      - analytics_data:/data/analytics
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 4
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    shm_size: 1gb
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - frontend
      - backend
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  frontend:
  backend:
    internal: true

volumes:
  analytics_data:
  caddy_data:
  caddy_config:
